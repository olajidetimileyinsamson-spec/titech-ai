<!-- templates/login.html -->
<img src="/logo.png" style="width:60px; margin-bottom:15px; border-radius:12px;">
<h2>Welcome to Titech AI</h2>
<p style="opacity:.7;font-size:14px;">Sign in to continue</p>

<input id="email" type="email" placeholder="Enter your email" style="width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#111;color:#fff;margin-top:15px;">

<button onclick="login()" style="width:100%;padding:12px;margin-top:12px;border-radius:10px;background:#7c3aed;color:white;border:0;font-weight:bold;cursor:pointer;">Continue</button>

<button onclick="alert('Google login coming soon - use email for now')" style="width:100%;padding:12px;margin-top:10px;border-radius:10px;background:#222;color:white;border:1px solid #444;cursor:pointer;">Continue with Google</button>

<a href="#" onclick="alert('Contact Titech support');return false;" style="display:block;margin-top:12px;font-size:13px;opacity:.6;">Forgot password?</a>

<script>
function login(){
 let e=document.getElementById('email').value.trim();
 if(!e ||!e.includes('@')){alert('Enter valid email');return;}
 localStorage.setItem('titech_email', e);
 localStorage.setItem('titech_name', e.split('@')[0]);
 window.location.href='/';
}
</script>
