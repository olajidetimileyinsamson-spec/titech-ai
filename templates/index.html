<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Titech AI</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#070f1e;
  background-image:
    linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  color:#fff;
  font-family:system-ui;
  display:flex;
  flex-direction:column;
  height:100vh;
}
.header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin:12px;background:rgba(13,22,45,0.85);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.08);border-radius:18px}
.h-left{display:flex;align-items:center;gap:10px}
.h-left img{width:38px;height:38px;border-radius:10px;background:#fff}
.pill{margin-top:5px;display:inline-block;font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;border:1px solid rgba(125,211,252,0.4);background:rgba(56,189,248,0.1);color:#7dd3fc;letter-spacing:0.5px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(56,189,248,0.4);background:rgba(0,0,0,0.3);color:#7dd3fc;display:flex;align-items:center;justify-content:center}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.user-msg{max-width:78%;align-self:flex-end;background:rgba(30,41,59,0.9);border:1px solid rgba(255,255,255,0.1);padding:12px 16px;border-radius:20px 20px 6px 20px;font-size:15px}
.ai-msg{max-width:85%;align-self:flex-start;background:linear-gradient(135deg,#7c3aed,#3b82f6 70%,#06b6d4);padding:14px 16px;border-radius:20px 20px 20px 6px;font-size:15px;line-height:1.4;position:relative;word-break:break-word;padding-top:32px;
.ai-msg img{max-width:100%;border-radius:12px;margin-top:10px;display:block}
.copy-btn{position:absolute;top:8px;right:8px;font-size:11px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:3px 8px;border-radius:8px;cursor:pointer}
.bottom-wrap{
  position:fixed;
  bottom:0;left:0;right:0;
  padding:10px 12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, #070f1e 80%, transparent);
  display:flex;
  flex-direction:column;
  align-items:center;
  z-index:99
}
.input-bar{
  display:flex;
  align-items:center;
  gap:10px;
  background:#1e293b;
  border:1px solid #2a3a52;
  border-radius:28px;
  padding:10px 14px;
  width:100%;
  max-width:720px;
  box-sizing:border-box
}
.input-bar input{
  flex:1;
  min-width:0;
  background:transparent;
  border:none;
  outline:none;
  color:#fff;
  font-size:16px
}
.small{font-size:11px;text-align:center;opacity:0.5;margin-top:8px}
#chat{flex:1;overflow-y:auto;padding:16px;padding-bottom:110px;display:flex;flex-direction:column}
#modalBg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:10}
#modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:360px;padding:20px;z-index:11;background:rgba(13,22,45,0.95);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:18px}
#greet{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1e293b;padding:10px 18px;border-radius:20px;display:none;z-index:20}
</style>
</head>
<body>
<div id="greet"></div>
<div id="modalBg" onclick="closeM()"></div>
<div class="header">
<div class="h-left">
<img src="/logo.png" alt="logo">
<div><div style="font-weight:800;font-size:18px">Titech AI</div><div class="pill" id="pill">FRIENDLY</div></div>
</div>
<button class="icon-btn" onclick="openM()">☰</button>
</div>

<div id="modal">
<h3 style="margin:0 0 8px">Settings ⚙️</h3>
<div>Username: <b id="dName"></b></div>
<div>Email: <b id="dEmail" style="font-size:12px"></b></div>
<label style="margin-top:12px;display:block;font-size:13px">Tone:</label>
<select id="toneSel" style="width:100%;padding:10px;border-radius:10px;margin-top:6px;background:#0f172a;color:#fff;border:1px solid rgba(255,255,255,0.1)">
<option value="friendly">friendly</option>
<option value="hype">hype</option>
<option value="professional">professional</option>
<option value="short">short</option>
<option value="teacher">teacher</option>
</select>
<button onclick="saveT()" style="width:100%;margin-top:14px;padding:11px;border-radius:12px;background:#2563eb;color:#fff;border:none;font-weight:700">Save</button>
<button onclick="closeM()" style="width:100%;margin-top:8px;padding:11px;border-radius:12px;background:rgba(255,255,255,0.08);color:#fff;border:none">Close</button>
</div>

<div id="chat">
<div class="ai-msg">✨ Welcome to Titech AI! Ask me anything — polished and clear. I can make it more professional, friendly, or hype if you'd like! ✨ <button class="copy-btn" onclick="copyText(this)">Copy</button></div>
</div>

<div class="bottom-wrap">
<div class="input-bar">
<button class="icon-btn" onclick="openM()">+</button>
<input id="msg" placeholder="Ask AI anything...">
<button class="icon-btn" onclick="send()" style="background:rgba(6,182,212,0.15);border-color:#22d3ee">↗</button>
</div>
<div class="small">Free tier · Privacy on · No training on your chats · <span id="smallTone">friendly</span></div>
</div>

<script>
let username = localStorage.getItem("titech_username") || localStorage.getItem("titech_name") || "User";
let user_email = localStorage.getItem("titech_email") || "";
let tone = localStorage.getItem("titech_tone") || "friendly";
document.getElementById("dName").textContent=username;
document.getElementById("dEmail").textContent=user_email;
document.getElementById("pill").textContent=tone.toUpperCase();
document.getElementById("toneSel").value=tone;
document.getElementById("smallTone").textContent=tone;
let g=document.getElementById("greet"); g.textContent="Welcome, "+username; g.style.display="block"; setTimeout(()=>g.style.display="none",3000);

function openM(){document.getElementById("modal").style.display="block";document.getElementById("modalBg").style.display="block";}
function closeM(){document.getElementById("modal").style.display="none";document.getElementById("modalBg").style.display="none";}
function saveT(){tone=document.getElementById("toneSel").value;localStorage.setItem("titech_tone",tone);document.getElementById("pill").textContent=tone.toUpperCase();document.getElementById("smallTone").textContent=tone;closeM();}

function copyText(btn){
  let txt=btn.parentElement.innerText.replace("Copied!","").replace("Copy","").trim();
  navigator.clipboard.writeText(txt);
  btn.textContent="Copied!"; setTimeout(()=>btn.textContent="Copy",1500);
}

function addMsg(text, cls, imageUrl=""){
  let c=document.getElementById("chat");
  let d=document.createElement("div");
  d.className=cls;
  d.style.cssText="position:relative;padding:14px 16px;padding-top:32px;margin-bottom:14px;border-radius:18px;max-width:85%;word-wrap:break-word;white-space:pre-wrap;background:linear-gradient(135deg,#7c3aed,#3b82f6);color:#fff;";
  if(cls==="user-msg") d.style.cssText="background:#1e293b;color:#fff;padding:14px 16px;margin-bottom:14px;border-radius:18px;max-width:85%;margin-left:auto;word-wrap:break-word;";
  let html=text;
  if(imageUrl){
    html+=`<br><img src="${imageUrl}" style="width:100%;max-width:380px;border-radius:12px;margin-top:10px;display:block;"><br><a href="${imageUrl}" download target="_blank" style="display:inline-block;margin-top:8px;padding:6px 12px;background:#fff;color:#000;border-radius:8px;text-decoration:none;font-weight:bold;">⬇ Save Image</a>`;
  }
  d.innerHTML=`${html}<button onclick="navigator.clipboard.writeText('${text.replace(/'/g,"\\'")}')" style="position:absolute;top:6px;right:6px;font-size:11px;padding:3px 8px;border-radius:6px;border:none;cursor:pointer;">Copy</button>`;
  c.appendChild(d);
  c.scrollTop=c.scrollHeight;
}
  
async function loadHistory(){
  let user_email=localStorage.getItem("titech_email")||"";
  if(!user_email) return;
  try{
    let r=await fetch(`/history?email=${user_email}`);
    let data=await r.json();
    data.forEach(m=>{
      addMsg(m.message,"user-msg");
      addMsg(m.reply,"ai-msg", m.image_url || "");
    });
  }catch(e){}
}

function addMsg(text, cls, imageUrl=""){
  let c=document.getElementById("chat");
  let d=document.createElement("div");
  d.className=cls;
  d.style.cssText="position:relative;padding:14px 16px;padding-top:32px;margin-bottom:14px;border-radius:18px;max-width:85%;word-wrap:break-word;white-space:pre-wrap;background:linear-gradient(135deg,#7c3aed,#3b82f6);color:#fff;";
  if(cls==="user-msg") d.style.cssText="background:#1e293b;color:#fff;padding:14px 16px;margin-bottom:14px;border-radius:18px;max-width:85%;margin-left:auto;word-wrap:break-word;";
  let html=text;
  if(imageUrl){
    html+=`<br><img src="${imageUrl}" style="width:100%;max-width:380px;border-radius:12px;margin-top:10px;display:block;"><br><a href="${imageUrl}" download target="_blank" style="display:inline-block;margin-top:8px;padding:6px 12px;background:#fff;color:#000;border-radius:8px;text-decoration:none;font-weight:bold;">⬇ Save Image</a>`;
  }
  d.innerHTML=`${html}<button onclick="navigator.clipboard.writeText('${text.replace(/'/g,"\\'")}')" style="position:absolute;top:6px;right:6px;font-size:11px;padding:3px 8px;border-radius:6px;border:none;cursor:pointer;">Copy</button>`;
  c.appendChild(d);
  c.scrollTop=c.scrollHeight;
}

async function send(){
  let inp=document.getElementById("msg");
  let t=inp.value.trim();
  if(!t) return;
  let c=document.getElementById("chat");
  addMsg(t,"user-msg");
  inp.value="";
  document.querySelectorAll("[id^='typing-']").forEach(e=>e.remove());
  let tid="typing-"+Date.now();
  let td=document.createElement("div");
  td.id=tid;
  td.className="ai-msg";
  td.style.cssText="padding:12px;margin-bottom:14px;opacity:0.7;background:linear-gradient(135deg,#7c3aed,#3b82f6);color:#fff;border-radius:18px;max-width:80%;";
  td.innerText="Typing...";
  c.appendChild(td);
  c.scrollTop=c.scrollHeight;
  try{
    let r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t, personality:"friendly", username:localStorage.getItem("titech_username")||"Boss", user_email:localStorage.getItem("titech_email")||""})});
    let d=await r.json();
    document.getElementById(tid)?.remove();
    addMsg(d.reply,"ai-msg", d.image_url || "");
  }catch(e){
    document.getElementById(tid)?.remove();
    addMsg("Network error Boss, try again 🙏","ai-msg");
  }
}
document.getElementById("msg").addEventListener("keydown",e=>{if(e.key==="Enter") send()});
loadHistory();
</script>
</body>
</html>
