<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Titech AI 🚀</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow-x:hidden !important;background:#060a14;font-family:sans-serif}
body{display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;padding:14px 16px;background:rgba(10,15,30,0.7);border-bottom:1px solid rgba(0,242,255,0.15);position:sticky;top:0}
.header b{color:#fff}.header b span{color:#00f2ff}
.hype{font-size:11px;color:#00f2ff;background:rgba(0,242,255,0.1);border:1px solid rgba(0,242,255,0.2);padding:4px 10px;border-radius:20px}
#chat{flex:1;overflow-y:auto;overflow-x:hidden !important;width:100%;max-width:100vw;padding:18px 12px 110px;display:flex;flex-direction:column;gap:16px}
.ai-wrap{align-self:flex-start !important;width:88% !important;max-width:88% !important;position:relative;overflow:hidden !important;background:linear-gradient(135deg,#3a5bff 0%,#7a3dff 100%);border-radius:18px;border-bottom-left-radius:6px;box-sizing:border-box}
.ai-wrap::after{content:"✨";position:absolute;top:-6px;right:-6px}
.ai{background:transparent !important;color:#fff;padding:14px 16px;font-size:14.5px;line-height:1.5;width:100% !important;max-width:100% !important;overflow-x:auto !important;display:block !important;box-sizing:border-box;-webkit-overflow-scrolling:touch}
.ai table{border-collapse:collapse;width:600px !important;min-width:600px !important;max-width:none !important;display:table;background:rgba(0,0,0,0.25);border-radius:10px;margin-top:8px}
.ai th,.ai td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.12);font-size:13px;text-align:left}
.ai th{background:rgba(0,0,0,0.35);color:#00f2ff}
.user-wrap{align-self:flex-end;max-width:82%}
.user{background:rgba(20,30,60,0.45);backdrop-filter:blur(10px);border:1px solid rgba(0,242,255,0.35);color:#e6f7ff;padding:12px 16px;border-radius:22px;border-bottom-right-radius:6px}
.bottom-wrap{position:fixed;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(to top,#060a14 80%,transparent)}
.input-area{display:flex;gap:10px;align-items:center;background:rgba(20,30,50,0.65);backdrop-filter:blur(16px);border:1px solid rgba(0,242,255,0.18);border-radius:28px;padding:6px 6px 6px 18px}
.input-area input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:15px}
.input-area button{width:44px;height:44px;border-radius:50%;border:none;background:radial-gradient(circle at 30% 30%,#00f2ff,#3a5bff);box-shadow:0 0 20px rgba(0,242,255,0.6);color:#fff;font-size:20px}
.trust{text-align:center;font-size:10px;color:#5a708a;margin-top:8px}
</style></head>
<body>
<div class="header"><b>Titech AI <span>🚀</span></b><span class="hype">FREE</span></div>
<div id="chat"></div>
<div class="bottom-wrap"><div class="input-area"><input id="msg" placeholder="Ask Titech AI 🚀..." onkeypress="if(event.key==='Enter')send()"><button onclick="send()">↑</button></div><div class="trust">Free tier · Privacy on · No training on your chats</div></div>
<script>
let chat=document.getElementById('chat'),input=document.getElementById('msg');
function addMessage(t,c){let w=document.createElement('div');w.className=c+'-wrap';let d=document.createElement('div');d.className=c;d.innerHTML=t;w.appendChild(d);chat.appendChild(w);chat.scrollTop=chat.scrollHeight;localStorage.setItem('titech-chat',chat.innerHTML)}
async function send(){let t=input.value.trim();if(!t)return;addMessage(t,'user');input.value='';let ty=document.createElement('div');ty.className='ai-wrap';ty.innerHTML='<div class="ai">Thinking...</div>';chat.appendChild(ty);try{let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});let d=await r.json();ty.remove();addMessage((d.response||'').replace(/\n/g,'<br>'),'ai')}catch{ty.remove();addMessage('Network glitch','ai')}}
window.onload=()=>{let s=localStorage.getItem('titech-chat');if(s)chat.innerHTML=s}
</script>
</body></html>
