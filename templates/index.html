<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Titech AI 🚀</title>
<link rel="icon" href="/logo.png">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4TGEVES8FL"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-4TGEVES8FL');
</script>
<style>
* { box-sizing:border-box; }
html, body { max-width:100%; overflow-x:hidden !important; margin:0; }
body { background:#0b1120; margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; display:flex; flex-direction:column; height:100vh; height:100dvh; overflow-x:hidden !important; }
.header { display:flex; align-items:center; padding:14px 16px; background:#0b1120; border-bottom:1px solid #1e2a4a; position:sticky; top:0; z-index:10; }
.header img { width:36px; height:36px; border-radius:50%; margin-right:12px; background:#162040; }
.header b { font-size:17px; }
#chat{flex:1;padding:12px 12px 90px 12px;overflow-y:auto;overflow-x:hidden!important;display:flex;flex-direction:column;gap:14px;width:100%;max-width:100%;box-sizing:border-box}
.user { align-self:flex-end; background:#2a5bd7; color:white; padding:12px 18px; border-radius:18px 18px 4px 18px; max-width:85% !important; word-break:break-word !important; overflow-wrap:anywhere !important; white-space:pre-wrap !important; }
.ai-wrap { align-self:flex-start; max-width:85% !important; width:100%; display:flex; flex-direction:column; gap:6px; overflow:hidden; word-break:break-word !important; overflow-wrap:anywhere !important; }
.ai { background:#162040; color:#dbe4ff; padding:14px 16px; border-radius:18px 18px 18px 4px; width:100%; max-width:100% !important; word-break:break-word !important; overflow-wrap:anywhere !important; white-space:pre-wrap !important; overflow:hidden; }
.ai img { max-width:100% !important; border-radius:12px; margin-top:8px; display:block; }
.actions { display:flex; gap:8px; margin-left:4px; }
.action-btn { background:#1e2a4a; border:1px solid #2a3a6a; color:#8aa0d0; padding:6px 10px; border-radius:12px; font-size:12px; }
.action-btn:hover { background:#25345e; color:white; }
.input-area { position:fixed; bottom:0; left:0; right:0; padding:12px; background:#0b1120; display:flex; gap:10px; border-top:1px solid #1e2a4a; }
.input-area input { flex:1; background:#162040; border:1px solid #1e2a4a; color:white; padding:13px 16px; border-radius:24px; outline:none; max-width:100%; }
.input-area input::placeholder { color:#6b7daa; }
.input-area button { background:#2a5bd7; color:white; border:none; padding:13px 24px; border-radius:24px; }
.input-area button:active { transform:scale(0.96); }
/* SAFE TABLE FIX - no cut for chats, same Code/View method you like */
.ai-wrap { max-width: 100%; overflow-x: hidden; }
.ai { max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }
.ai table { display: block; max-width: 100%; overflow-x: auto; white-space: nowrap; border: 1px solid #2a2a2a; border-radius: 10px; }
.ai a { word-break: break-all; }  
</style>
</head>
<body>

<div class="header">
  <img src="/logo.png">
  <b>Titech AI 🚀</b>
</div>

<div id="chat">
  <div class="ai-wrap">
    <div class="ai">Hey there! I'm Titech AI 🚀✨<br>Your playful AI buddy — ask me anything, create images, or just gist! 😎</div>
  </div>
</div>

<div class="input-area">
  <input id="msg" placeholder="Ask me anything... ✨" onkeypress="if(event.key==='Enter')send()">
  <button onclick="send()">Send 🚀</button>
</div>

<script>
let chat = document.getElementById('chat');
  // Load saved chat
let saved = localStorage.getItem('titech_chat');
if(saved && saved.includes('<div')){
  chat.innerHTML = saved;
} else {
  localStorage.removeItem('titech_chat');
}

function addMsg(text, cls){
  if(cls==='user'){
    let div=document.createElement('div'); div.className='user'; div.innerText=text;
    chat.appendChild(div);
  } else {
    let wrap=document.createElement('div'); wrap.className='ai-wrap';
    let div=document.createElement('div'); div.className='ai';

    // Check if image url
    let isImage = text.match(/https?:\/\/.*\.(jpeg|jpg|gif|png|webp)/i) || text.startsWith('data:image');
    if(isImage){
        div.innerHTML = `<img src="${text}" alt="AI Image"><br>${text}`;
    } else {
        div.innerHTML = text.replace(/\n/g,'<br>');
    }

    let actions=document.createElement('div'); actions.className='actions';
    actions.innerHTML = `
      <button class="action-btn" onclick="copyText(this)">📋 Copy</button>
      ${isImage? `<button class="action-btn" onclick="saveImage('${text}')">💾 Save</button>` : `<button class="action-btn" onclick="saveText(this)">💾 Save</button>`}
      <button class="action-btn" onclick="feedback(this,'up')">👍</button>
      <button class="action-btn" onclick="feedback(this,'down')">👎</button>
    `;
    wrap.appendChild(div); wrap.appendChild(actions); chat.appendChild(wrap);
  }
  chat.scrollTop = chat.scrollHeight;
  localStorage.setItem('titech_chat', chat.innerHTML);
}

async function send(){
  let input=document.getElementById('msg'); let text=input.value.trim(); if(!text) return;
  addMsg(text,'user'); input.value='';

  // typing effect ✨
  let wrap=document.createElement('div'); wrap.className='ai-wrap'; wrap.id='typing';
  wrap.innerHTML=`<div class="ai">Thinking... 🤔💭</div>`; chat.appendChild(wrap); chat.scrollTop=chat.scrollHeight;

  try{
    // CHECK IF NA IMAGE
    if(text.toLowerCase().includes('generate') || text.toLowerCase().includes('create image') || text.toLowerCase().includes('draw') || text.toLowerCase().includes('image')){
      wrap.innerHTML=`<div class="ai">Generating image... 🎨✨</div>`;
      let res=await fetch('/generate-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:text})});
      let data=await res.json();
      wrap.remove();
      if(data.image_url){
        addMsg(`<img src="${data.image_url}" style="width:100%;max-width:500px;border-radius:12px;"><br><small>${text}</small>`, 'ai');
      } else {
        addMsg('Image failed, try again bro', 'ai');
      }
    } else {
      // NORMAL CHAT
      let res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
      let data=await res.json();
      wrap.remove();
      addMsg(data.reply || data.response || 'No reply', 'ai');
    }
  } catch(e){
    let t=document.getElementById('typing'); if(t) t.remove();
    addMsg('Error: '+e.message, 'ai');
  }
}

function copyText(btn){
  let txt = btn.closest('.ai-wrap').querySelector('.ai').innerText;
  navigator.clipboard.writeText(txt);
  btn.innerText='✅ Copied!'; setTimeout(()=>btn.innerText='📋 Copy',1500);
}
function saveText(btn){
  let txt = btn.closest('.ai-wrap').querySelector('.ai').innerText;
  let blob = new Blob([txt], {type:'text/plain'});
  let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='titech-ai-response.txt'; a.click();
}
function saveImage(url){
  let a=document.createElement('a'); a.href=url; a.download='titech-ai-image.png'; a.target='_blank'; a.click();
}
function feedback(btn, type){
  btn.innerText = type==='up'? '👍 Thanks!' : '👎 Noted!';
  fetch('/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:type})}).catch(()=>{});
  setTimeout(()=>btn.innerText= type==='up'? '👍' : '👎',1500);
}
</script>
</body>
</html>
