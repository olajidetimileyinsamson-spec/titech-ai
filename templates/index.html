<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Titech AI</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0; background:#07081a;
 background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
 background-size:40px 40px; color:#fff; font-family:system-ui; display:flex; flex-direction:column; height:100vh; overflow:hidden;
}
.header{padding:14px 16px; display:flex; justify-content:space-between; align-items:center; background:rgba(15,15,30,0.8); backdrop-filter:blur(10px); border-bottom:1px solid rgba(168,85,247,0.15);}
.h-left{display:flex; align-items:center; gap:10px;}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#a855f7,#ec4899);}
.icon-btn{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); color:#fff; width:36px; height:36px; border-radius:8px; cursor:pointer;}
#chat{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; padding-bottom:100px;}
.user-msg{align-self:flex-end; background:linear-gradient(135deg,#7c3aed,#a855f7); padding:12px 16px; border-radius:18px 18px 4px 18px; max-width:80%; word-wrap:break-word;}
.ai-msg{align-self:flex-start; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1); padding:14px 16px; border-radius:18px 18px 18px 4px; max-width:85%; word-wrap:break-word;}
.ai-msg img{max-width:100%; border-radius:12px; margin-top:8px;}
.copy-btn{position:absolute; top:8px; right:8px; background:rgba(255,255,255,0.1); border:none; color:#fff; padding:4px 8px; border-radius:6px; font-size:11px; cursor:pointer;}
.input-bar{position:fixed; bottom:0; left:0; right:0; padding:12px 12px 20px 12px; background:rgba(7,8,26,0.9); backdrop-filter:blur(20px); border-top:1px solid rgba(255,255,255,0.08); display:flex; gap:10px; align-items:center;}
.input-bar input{flex:1; min-width:0; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); color:#fff; padding:14px 16px; border-radius:24px; outline:none;}
#sendBtn{background:linear-gradient(135deg,#a855f7,#ec4899); color:#fff; border:none; width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:18px;}
#modal{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; justify-content:center; align-items:center;}
.modal-box{background:#14141f; padding:20px; border-radius:16px; width:90%; max-width:360px; border:1px solid rgba(168,85,247,0.2);}
select{width:100%; padding:10px; border-radius:8px; background:#0a0a0f; color:#fff; border:1px solid rgba(255,255,255,0.15); margin-top:8px;}
.neon-badge{ display:flex; align-items:center; gap:6px; background:rgba(0,0,0,0.4); border:1px solid rgba(168,85,247,0.5); padding:6px 12px; border-radius:20px; font-size:12px; box-shadow:0 0 10px rgba(168,85,247,0.6), 0 0 20px rgba(236,72,153,0.3); animation:neonPulse 2s infinite alternate; }
@keyframes neonPulse{ 0%{ box-shadow:0 0 8px rgba(168,85,247,0.5) } 100%{ box-shadow:0 0 14px rgba(168,85,247,0.9), 0 0 28px rgba(236,72,153,0.5) } }
.thinking-box{ background:rgba(168,85,247,0.08); border-left:3px solid #a855f7; padding:10px 12px; border-radius:8px; margin-bottom:10px; font-size:13px; opacity:0.85; }
</style>
</head>
<body>
<div id="modal" onclick="closeM()"><div class="modal-box" onclick="event.stopPropagation()">
  <div style="display:flex; justify-content:space-between;"><b>⚙️ Settings</b><span onclick="closeM()" style="cursor:pointer;">✕</span></div>
  <div style="margin-top:16px;">
    <label style="font-size:12px; opacity:0.8;">Email - idEmail</label>
    <div id="idEmail" style="font-size:14px; margin-top:4px; padding:8px; background:rgba(255,255,255,0.05); border-radius:8px;"></div>
    <label style="display:block; margin-top:16px; font-size:12px; opacity:0.8;">Tone</label>
    <select id="personality" onchange="localStorage.setItem('titech_personality', this.value)">
      <option value="friendly">😊 Friendly</option>
      <option value="hyper">⚡ Hyper</option>
      <option value="professional">👔 Professional</option>
      <option value="teacher">📚 Teacher</option>
      <option value="deepthink">🧠 Deep Thinking</option>
    </select>
    <div style="margin-top:16px; font-size:12px; opacity:0.7;">User: <span id="idUser"></span></div>
    <button class="icon-btn" style="width:100%; margin-top:16px; height:auto; padding:10px;" onclick="logout()">Logout</button>
  </div>
</div></div>

<div class="header">
  <div class="h-left">
    <img src="/logo.png" class="logo"><b>Titech AI</b>
    <div id="viewBadge" class="neon-badge" style="margin-left:12px; display:none;"><span>👁️</span><span id="viewCount">...</span><span style="width:8px;height:8px;background:#00ff88;border-radius:50%;display:inline-block;margin-left:4px;box-shadow:0 0 6px #00ff88;"></span></div>
  </div>
  <button class="icon-btn" onclick="openM()">⚙️</button>
</div>

<div id="chat"><div class="ai-msg">👋 Welcome to Titech AI! I now remember our chats and can think deeply!</div></div>
<div class="input-bar"><input id="msg" placeholder="Ask anything..." onkeydown="if(event.key==='Enter') send()"><button id="sendBtn" onclick="send()">↑</button></div>

<script>
let titech_email = localStorage.getItem('titech_email');
let titech_name = localStorage.getItem('titech_name');
if(!titech_email || !titech_email.includes('@')){ window.location.href='/login'; }
document.getElementById('idEmail').innerText = titech_email || 'guest';
document.getElementById('idUser').innerText = titech_name || 'Boss';

// ADMIN ONLY - Olajide Timileyin Samson
const ADMIN_EMAIL = "olajidetimileyinsamson@gmail.com";
if(titech_email && titech_email.toLowerCase() === ADMIN_EMAIL.toLowerCase()){
  document.getElementById('viewBadge').style.display = 'flex';
}

document.getElementById('personality').value = localStorage.getItem('titech_personality') || 'friendly';
function openM(){ document.getElementById('modal').style.display='flex'; }
function closeM(){ document.getElementById('modal').style.display='none'; }
function logout(){ localStorage.clear(); window.location.href='/login'; }

function copyText(btn){
  let text = btn.getAttribute('data-copy');
  let temp = document.createElement('div');
  temp.innerHTML = text;
  let clean = temp.innerText || temp.textContent;
  navigator.clipboard.writeText(clean).then(()=>{
    let old = btn.innerText;
    btn.innerText = 'Copied!';
    setTimeout(()=>btn.innerText = old, 1500);
  }).catch(()=>{
    let ta = document.createElement('textarea');
    ta.value = clean;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    btn.innerText = 'Copied!';
    setTimeout(()=>btn.innerText='Copy',1500);
  });
}

function addMsg(text, cls, image_url){
  let d=document.createElement('div'); d.className=cls; d.style.position='relative';
  let html=marked.parse(text); let thinkingHTML='';
  if(text.includes('<think>')){
    let m=text.match(/<think>([\s\S]*?)<\/think>/);
    if(m){ thinkingHTML=`<div class="thinking-box"><b>🧠 Thinking:</b><br>${marked.parse(m[1])}</div>`; html=html.replace(m[0],''); }
  }
  let escaped = text.replace(/"/g,'&quot;');
  d.innerHTML=thinkingHTML+html+(image_url?`<img src="${image_url}" loading="lazy">`:'')+`<button class="copy-btn" data-copy="${escaped}" onclick="copyText(this)">Copy</button>`;
  document.getElementById('chat').appendChild(d);
  document.getElementById('chat').scrollTop=document.getElementById('chat').scrollHeight;
}

async function loadHistory(){
  try{ if(!titech_email) return; let res=await fetch(`/history?email=${encodeURIComponent(titech_email)}`); let data=await res.json(); if(data&&data.length){ document.getElementById('chat').innerHTML=''; data.forEach(m=>{ addMsg(m.message,'user-msg',''); addMsg(m.reply,'ai-msg',m.image_url||''); }); } }catch(e){console.log(e);}
}
async function fetchStats(){ try{ let r=await fetch('/stats'); let j=await r.json(); document.getElementById('viewCount').innerText=j.total_views+' 👥 '+j.total_chats; }catch{} }
fetchStats(); setInterval(fetchStats,10000); loadHistory();

async function send(){
  let input=document.getElementById('msg'); let txt=input.value.trim(); if(!txt) return; addMsg(txt,'user-msg',''); input.value='';
  let typingId='typing-'+Date.now(); let typingDiv=document.createElement('div'); typingDiv.id=typingId; typingDiv.className='ai-msg'; typingDiv.innerText='Titech AI is thinking...'; document.getElementById('chat').appendChild(typingDiv);
  document.getElementById('chat').scrollTop=document.getElementById('chat').scrollHeight;
  try{
    let res=await fetch('/chat',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:txt, username:titech_name||'Boss', user_email:titech_email, personality:document.getElementById('personality').value||'friendly'})});
    let data=await res.json(); document.getElementById(typingId).remove(); addMsg(data.reply||'Error','ai-msg',data.image_url||'');
  }catch(e){ document.getElementById(typingId).remove(); addMsg('Network error Boss, try again ⚡','ai-msg',''); }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') loadHistory(); });
</script>
</body>
</html>
