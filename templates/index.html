<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Titech AI 🚀</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;max-width:100vw;overflow-x:hidden !important;overscroll-behavior-x:none;background:#060a14;color:#fff;font-family:-apple-system,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;touch-action:pan-y}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(600px at 20% 10%, rgba(0,242,255,0.18), transparent 60%),radial-gradient(800px at 80% 80%, rgba(90,50,255,0.22), transparent 60%),linear-gradient(rgba(0,242,255,0.07) 1px, transparent 1px),linear-gradient(90deg, rgba(0,242,255,0.05) 1px, transparent 1px);background-size:auto,auto,40px 40px,40px 40px}
.header{position:sticky;top:0;z-index:10;width:100%;max-width:100vw;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:rgba(10,15,30,0.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,242,255,0.15)}
.header b span{color:#00f2ff}.hype{font-size:11px;color:#00f2ff;background:rgba(0,242,255,0.12);border:1px solid rgba(0,242,255,0.25);padding:4px 10px;border-radius:20px}
#chat{flex:1;width:100%;max-width:100vw;overflow-x:hidden !important;overflow-y:auto;padding:18px 12px 120px 12px;display:flex;flex-direction:column;gap:18px}
.ai-wrap{max-width:88%;align-self:flex-start;width:100%;overflow:hidden}
.ai{background:linear-gradient(135deg,#3a5bff 0%,#7a3dff 100%);padding:14px 16px;border-radius:18px 18px 18px 6px;box-shadow:0 0 20px rgba(90,70,255,0.35);font-size:14.5px;line-height:1.5;word-break:break-word;overflow-wrap:anywhere}
.user-wrap{max-width:82%;align-self:flex-end;display:flex;flex-direction:column;align-items:flex-end;width:100%}
.user{background:rgba(20,30,60,0.6);backdrop-filter:blur(10px);border:1px solid rgba(0,242,255,0.4);box-shadow:0 0 15px rgba(0,242,255,0.25);padding:12px 16px;border-radius:22px 22px 6px 22px;font-size:14.5px;word-break:break-word;overflow-wrap:anywhere;max-width:100%}
.actions{display:flex;gap:8px;margin-top:6px}
.actions button{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#a8c0d0;font-size:11px;padding:4px 8px;border-radius:12px;cursor:pointer}
.actions button:active{transform:scale(0.95)}
.bottom-wrap{position:fixed;bottom:0;left:0;right:0;z-index:20;width:100%;max-width:100vw;padding:12px;background:linear-gradient(to top,#060a14 90%,transparent)}
.input-area{width:100%;display:flex;gap:10px;align-items:center;background:rgba(20,30,50,0.8);backdrop-filter:blur(16px);border:1px solid rgba(0,242,255,0.2);border-radius:28px;padding:6px 6px 6px 18px}
.input-area input{flex:1;min-width:0;background:transparent;border:none;color:#fff;outline:none;font-size:15px}
.input-area button{width:44px;height:44px;flex-shrink:0;border-radius:50%;border:none;background:radial-gradient(circle at 30% 30%,#00f2ff,#3a5bff);box-shadow:0 0 20px rgba(0,242,255,0.6);color:#fff;font-size:20px}
.trust{text-align:center;font-size:10px;color:#5a708a;margin-top:8px}
table{width:100% !important;display:block !important;overflow-x:auto !important;white-space:normal !important}
</style>
</head>
<body>
<div class="header"><b>Titech AI <span>🚀</span></b><span class="hype">FREE • hype</span></div>
<div id="chat"></div>
<div class="bottom-wrap">
<div class="input-area"><input id="msg" placeholder="Ask Titech AI 🚀..." onkeypress="if(event.key==='Enter')send()"><button onclick="send()">↑</button></div>
<div class="trust">Free tier · Privacy on · No training on your chats</div>
</div>
<script>
let chat=document.getElementById('chat'), input=document.getElementById('msg');
function addMessage(t,c){
 let w=document.createElement('div'); w.className=c+'-wrap';
 let d=document.createElement('div'); d.className=c; d.textContent=t;
 let act=document.createElement('div'); act.className='actions';
 let cp=document.createElement('button'); cp.textContent='📋 Copy';
 cp.onclick=()=>{navigator.clipboard.writeText(t); cp.textContent='✅ Copied'; setTimeout(()=>cp.textContent='📋 Copy',1200);};
 let del=document.createElement('button'); del.textContent='🗑️ Delete';
 del.onclick=()=>{w.remove();};
 act.appendChild(cp); act.appendChild(del);
 w.appendChild(d); w.appendChild(act);
 chat.appendChild(w); chat.scrollTop=chat.scrollHeight;
}
async function send(){let t=input.value.trim();if(!t)return;addMessage(t,'user');input.value='';let ty=document.createElement('div');ty.className='ai-wrap';ty.innerHTML='<div class="ai">Thinking...</div>';chat.appendChild(ty);chat.scrollTop=chat.scrollHeight;try{let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});let d=await r.json();ty.remove();addMessage(d.response||d.reply||'No reply','ai');}catch{ty.remove();addMessage('Network glitch, try again','ai');}}
</script>
</body>
</html>
