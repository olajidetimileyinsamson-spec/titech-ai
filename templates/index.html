<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Titech AI 🚀</title>
<link rel="icon" href="logo.png">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100%; overflow-x:hidden; background:#060a14; font-family:-apple-system,BlinkMacSystemFont,sans-serif; }
body { display:flex; flex-direction:column; position:relative; }
body::before {
  content:""; position:fixed; inset:0; z-index:-2;
  background:
    radial-gradient(600px at 20% 10%, rgba(0,242,255,0.15), transparent 60%),
    radial-gradient(800px at 80% 80%, rgba(90,50,255,0.18), transparent 60%),
    linear-gradient(rgba(0,242,255,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,242,255,0.05) 1px, transparent 1px);
  background-size: auto, auto, 40px 40px, 40px 40px;
}
body::after {
  content:""; position:fixed; inset:0; z-index:-1; opacity:0.4;
  background-image: radial-gradient(rgba(0,242,255,0.8) 1px, transparent 1px);
  background-size: 60px 60px;
}
.header { display:flex; justify-content:space-between; padding:14px 16px; background:rgba(10,15,30,0.7); backdrop-filter:blur(12px); border-bottom:1px solid rgba(0,242,255,0.15); position:sticky; top:0; z-index:10; }
.header b { color:#fff; }.header b span{ color:#00f2ff; }
.hype { font-size:11px; color:#00f2ff; background:rgba(0,242,255,0.1); border:1px solid rgba(0,242,255,0.2); padding:4px 10px; border-radius:20px; }
#chat { flex:1; overflow-y:auto; overflow-x:hidden; padding:18px 12px 110px 12px; display:flex; flex-direction:column; gap:16px; }
.ai-wrap { align-self:flex-start; max-width:88%; position:relative; }
.ai-wrap::after { content:"✨"; position:absolute; top:-6px; right:-6px; }
.ai { background: linear-gradient(135deg, #3a5bff 0%, #7a3dff 100%); color:#fff; padding:14px 16px; border-radius:18px; border-bottom-left-radius:6px; box-shadow: 0 0 20px rgba(90,70,255,0.35); font-size:14.5px; line-height:1.5; overflow-x:auto; -webkit-overflow-scrolling:touch; }
.ai table { border-collapse:collapse; min-width:580px; width:max-content; background:rgba(0,0,0,0.25); border-radius:10px; margin-top:8px; }
.ai th,.ai td { padding:10px 12px; border-bottom:1px solid rgba(255,255,255,0.12); font-size:13px; }
.ai th { background:rgba(0,0,0,0.35); color:#00f2ff; }
.user-wrap { align-self:flex-end; max-width:82%; }
.user { background: rgba(20,30,60,0.45); backdrop-filter:blur(10px); border:1px solid rgba(0,242,255,0.35); box-shadow: 0 0 15px rgba(0,242,255,0.25); color:#e6f7ff; padding:12px 16px; border-radius:22px; border-bottom-right-radius:6px; }
.bottom-wrap { position:fixed; bottom:0; left:0; right:0; padding:12px; background:linear-gradient(to top, #060a14 80%, transparent); z-index:20; }
.input-area { display:flex; gap:10px; align-items:center; background:rgba(20,30,50,0.65); backdrop-filter:blur(16px); border:1px solid rgba(0,242,255,0.18); border-radius:28px; padding:6px 6px 6px 18px; }
.input-area input { flex:1; background:transparent; border:none; color:#fff; outline:none; font-size:15px; }
.input-area button { width:44px; height:44px; border-radius:50%; border:none; background: radial-gradient(circle at 30% 30%, #00f2ff, #3a5bff); box-shadow: 0 0 20px rgba(0,242,255,0.6); color:#fff; font-size:20px; }
.trust { text-align:center; font-size:10px; color:#5a708a; margin-top:8px; }
</style>
</head>
<body>
<div class="header"><b>Titech AI <span>🚀</span></b><span class="hype">FREE • hype</span></div>
<div id="chat"></div>
<div class="bottom-wrap">
<div class="input-area"><input id="msg" placeholder="Ask Titech AI 🚀..." onkeypress="if(event.key==='Enter')send()"><button onclick="send()">↑</button></div>
<div class="trust">Free tier · Privacy on · No training on your chats</div>
</div>
<script>
let chat=document.getElementById('chat'), input=document.getElementById('msg');
function addMessage(text,cls){ let w=document.createElement('div'); w.className=cls+'-wrap'; let d=document.createElement('div'); d.className=cls; d.innerHTML=text; w.appendChild(d); chat.appendChild(w); chat.scrollTop=chat.scrollHeight; localStorage.setItem('titech-chat', chat.innerHTML); }
async function send(){ let t=input.value.trim(); if(!t) return; addMessage(t,'user'); input.value=''; let ty=document.createElement('div'); ty.className='ai-wrap'; ty.innerHTML='<div class="ai">Thinking...</div>'; chat.appendChild(ty); try{ let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})}); let d=await r.json(); ty.remove(); addMessage((d.response||'No reply').replace(/\n/g,'<br>'),'ai'); }catch{ ty.remove(); addMessage('Network glitch','ai'); } }
window.onload=()=>{ let s=localStorage.getItem('titech-chat'); if(s) chat.innerHTML=s; }
</script>
</body>
</html>
