<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Titech AI 🚀</title>
<style>
/* PAGE LOCK - THIS FIXES YOUR 3X WIDE PROBLEM */
html{width:100%; max-width:100vw; overflow-x:hidden !important; position:relative}
body{width:100%; max-width:100vw !important; overflow-x:hidden !important; background:#060a14; margin:0; display:flex; flex-direction:column; position:relative; left:0; right:0}
*{box-sizing:border-box; max-width:100vw}
*{ -webkit-text-size-adjust:100% }

.header{display:flex;justify-content:space-between;padding:14px 16px;background:rgba(10,15,30,0.9);border-bottom:1px solid rgba(0,242,255,0.15);position:sticky;top:0;z-index:10;width:100%;max-width:100vw}
#chat{width:100% !important; max-width:100vw !important; overflow-x:hidden !important; padding:18px 12px 110px; display:flex; flex-direction:column; gap:16px; box-sizing:border-box}

/* BUBBLES LOCKED TO PHONE */
.ai-wrap{align-self:flex-start; width:88% !important; max-width:88% !important; overflow:hidden !important; background:linear-gradient(135deg,#3a5bff,#7a3dff); border-radius:18px; border-bottom-left-radius:6px}
.user-wrap{align-self:flex-end; width:82% !important; max-width:82% !important; overflow:hidden}
.ai{color:#fff;padding:14px 16px;font-size:14.5px;line-height:1.5;width:100%;max-width:100%;box-sizing:border-box}
.ai .table-scroll{width:100% !important; max-width:100% !important; overflow-x:auto !important; display:block !important; -webkit-overflow-scrolling:touch}
.ai table{width:600px !important; min-width:600px !important}
.ai th,.ai td{padding:10px;border-bottom:1px solid rgba(255,255,255,0.12);white-space:nowrap}
.user{background:rgba(20,30,60,0.6);border:1px solid rgba(0,242,255,0.3);color:#e6f7ff;padding:12px 16px;border-radius:22px;border-bottom-right-radius:6px;word-wrap:break-word;overflow-wrap:anywhere}

/* INPUT LOCKED TO PHONE */
.bottom-wrap{position:fixed;bottom:0;left:0;right:0;width:100%;max-width:100vw;padding:12px;background:#060a14;box-sizing:border-box}
.input-area{display:flex;gap:10px;width:100%;max-width:100%;background:rgba(20,30,50,0.8);border:1px solid rgba(0,242,255,0.2);border-radius:28px;padding:6px 6px 6px 18px;box-sizing:border-box}
.input-area input{flex:1;min-width:0;background:transparent;border:none;color:#fff;outline:none}
.input-area button{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:none;background:#00f2ff;color:#000}
</style></head>
<body>
<div class="header"><b>Titech AI <span style="color:#00f2ff">🚀</span></b><span style="font-size:11px;color:#00f2ff;border:1px solid rgba(0,242,255,0.3);padding:4px 10px;border-radius:20px">FREE</span></div>
<div id="chat"></div>
<div class="bottom-wrap"><div class="input-area"><input id="msg" placeholder="Ask Titech AI 🚀..." onkeypress="if(event.key==='Enter')send()"><button onclick="send()">↑</button></div></div>
<script>
let chat=document.getElementById('chat'),input=document.getElementById('msg');
// FORCE CLEAR OLD 3X WIDE DATA
localStorage.removeItem('titech-chat'); localStorage.removeItem('titech-chat-v2');
function mdTableToHtml(txt){
 let L=txt.split('\n'),o='',r=[],inT=false;
 L.forEach(l=>{
  if(l.trim().startsWith('|')){
   let c=l.split('|').filter(x=>x.trim()!='').map(x=>x.trim());
   if(c.every(x=>/^[-:]+$/.test(x)))return;
   r.push(c);inT=true;
  }else{
   if(inT&&r.length){
    o+='<div class="table-scroll"><table><tr>';r[0].forEach(x=>o+=`<th>${x}</th>`);o+='</tr>';
    for(let i=1;i<r.length;i++){o+='<tr>';r[i].forEach(x=>o+=`<td>${x}</td>`);o+='</tr>';}
    o+='</table></div>';r=[];inT=false;
   }
   o+=l+'<br>';
  }
 });
 if(r.length){o+='<div class="table-scroll"><table><tr>';r[0].forEach(x=>o+=`<th>${x}</th>`);o+='</tr>';for(let i=1;i<r.length;i++){o+='<tr>';r[i].forEach(x=>o+=`<td>${x}</td>`);o+='</tr>';}o+='</table></div>';}
 return o;
}
function addMessage(t,c){
 let w=document.createElement('div');w.className=c+'-wrap';
 let d=document.createElement('div');d.className=c;
 d.innerHTML=c==='ai'?mdTableToHtml(t):t.replace(/\n/g,'<br>');
 w.appendChild(d);chat.appendChild(w);chat.scrollTop=chat.scrollHeight;
}
async function send(){
  let t=input.value.trim();if(!t)return;addMessage(t,'user');input.value='';
  let ty=document.createElement('div');ty.className='ai-wrap';ty.innerHTML='<div class="ai">Thinking...</div>';chat.appendChild(ty);
  try{let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});let d=await r.json();ty.remove();addMessage((d.response||'').replace(/\n/g,'<br>'),'ai')}catch{ty.remove();addMessage('Network error','ai')}
}
// LOCK PAGE WIDTH ON LOAD
window.addEventListener('load',()=>{document.body.style.maxWidth='100vw'; document.documentElement.style.maxWidth='100vw'; document.body.style.overflowX='hidden'});
</script>
</body></html>
