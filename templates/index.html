<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TITECH AI</title>
<style>
body{font-family:Arial;background:#0f0f0f;color:white;margin:0;display:flex;flex-direction:column;height:100vh}
.header{display:flex;align-items:center;padding:15px;background:#1a1a1a}
.header img{width:40px;height:40px;border-radius:50%;margin-right:10px}
#chat{flex:1;overflow-y:auto;padding:15px}
.msg{margin:10px 0;padding:12px;border-radius:12px;max-width:80%}
.user{background:#3b82f6;margin-left:auto}
.ai{background:#2a2a2a}
.input-area{display:flex;padding:10px;background:#1a1a1a}
input{flex:1;padding:12px;border-radius:20px;border:none;background:#2a2a2a;color:white;outline:none}
button{margin-left:8px;padding:12px 20px;border-radius:20px;border:none;background:#3b82f6;color:white}
</style>
</head>
<body>
<div class="header">
<img src="/static/logo.png" onerror="this.src='/logo.png'">
<h3>TITECH AI ✨</h3>
</div>
<div id="chat"></div>
<div class="input-area">
<input id="q" placeholder="Ask me anything...">
<button onclick="send()">Send</button>
</div>
<script>
let sessionId=localStorage.getItem('titech_session')||Date.now().toString();
localStorage.setItem('titech_session',sessionId);
let history=JSON.parse(localStorage.getItem('titech_chat')||'[]');
const chatDiv=document.getElementById('chat');
history.forEach(m=>addMsg(m.text,m.type,m.img));
function addMsg(text,type,img=null){
 const d=document.createElement('div');d.className='msg '+type;
 d.innerHTML=text+(img?`<br><img src="${img}" style="width:100%;border-radius:10px;margin-top:10px">`:'');
 chatDiv.appendChild(d);chatDiv.scrollTop=chatDiv.scrollHeight;
}
async function send(){
 const input=document.getElementById('q');const q=input.value.trim();if(!q)return;
 addMsg(q,'user');history.push({text:q,type:'user'});localStorage.setItem('titech_chat',JSON.stringify(history));input.value='';
 try{
  const res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:q,session_id:sessionId})});
  const data=await res.json();addMsg(data.reply,'ai',data.image);history.push({text:data.reply,type:'ai',img:data.image});localStorage.setItem('titech_chat',JSON.stringify(history));
 }catch(e){addMsg('Network error','ai')}
}
document.getElementById('q').addEventListener('keypress',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
