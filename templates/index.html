<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Titech AI 🚀</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;max-width:100vw;overflow-x:hidden!important;background:#050a14;color:#fff;font-family:-apple-system,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overscroll-behavior-x:none;touch-action:pan-y}
.bg{position:fixed;inset:0;z-index:-2;background:#030711}
.bg::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,255,255,0.06) 1px, transparent 1px),linear-gradient(90deg, rgba(0,255,255,0.06) 1px, transparent 1px);background-size:50px 50px}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(600px at 15% 15%, rgba(0,242,255,0.18), transparent 60%),radial-gradient(700px at 85% 85%, rgba(100,50,255,0.22), transparent 60%)}
.wrap{width:100%;max-width:400px;margin:0 auto;display:flex;flex-direction:column;height:100vh;height:100dvh}
.header{margin:12px;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border:1px solid rgba(0,242,255,0.18);border-radius:20px}
.h-left{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:8px;object-fit:contain;background:rgba(0,242,255,0.1)}
.h-title{font-weight:800;font-size:16px;display:flex;align-items:center;gap:4px}
.h-right{display:flex;align-items:center;gap:8px}
.pill{font-size:10px;padding:5px 10px;border-radius:20px;border:1px solid rgba(0,242,255,0.25);background:rgba(0,242,255,0.1);color:#7fefff}
.pill.friendly{background:rgba(130,255,180,0.1);border-color:rgba(130,255,180,0.25);color:#a7ffbf}
.icon-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:50%;font-size:14px}
#chat{flex:1;width:100%;overflow-x:hidden!important;overflow-y:auto;padding:10px 14px 130px 14px;display:flex;flex-direction:column;gap:18px}
.ai-wrap{max-width:85%;align-self:flex-start;position:relative}
.ai-wrap::before{content:"✨";position:absolute;top:-10px;left:-6px}
.ai{background:linear-gradient(135deg, #00d4ff 0%, #6a5cff 100%);padding:14px 16px;border-radius:20px 20px 20px 4px;box-shadow:0 0 22px rgba(0,242,255,0.4);font-size:14px;line-height:1.5;word-break:break-word;overflow-wrap:anywhere}
.user-wrap{max-width:82%;align-self:flex-end;display:flex;flex-direction:column;align-items:flex-end}
.user{background:rgba(255,255,255,0.07);backdrop-filter:blur(16px);border:1px solid rgba(0,242,255,0.25);padding:12px 16px;border-radius:20px 20px 4px 20px;font-size:14px;word-break:break-word;overflow-wrap:anywhere;width:100%}
.actions{display:flex;gap:6px;margin-top:6px}
.actions button{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#8fb0c0;font-size:10px;padding:3px 8px;border-radius:10px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:400px;padding:12px;z-index:20;background:linear-gradient(to top, #050a14 88%, transparent)}
.input-bar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border:1px solid rgba(0,242,255,0.15);border-radius:28px;padding:6px 6px 6px 14px}
.input-bar .plus{color:#00f2ff;font-size:26px;background:none;border:none}
.input-bar input{flex:1;min-width:0;background:transparent;border:none;color:#fff;outline:none;font-size:14px}
.input-bar .send{width:40px;height:40px;flex-shrink:0;border-radius:50%;border:none;background:radial-gradient(circle at 30% 30%, #00f2ff, #7a3dff);box-shadow:0 0 18px rgba(0,242,255,0.6);color:#fff}
.trust{text-align:center;font-size:10px;color:rgba(100,200,220,0.35);margin-top:8px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
<div class="header">
<div class="h-left">
  <img src="/logo.png" onerror="this.src='/static/logo.png'; this.onerror=null" class="logo" alt="logo">
  <div>
    <div class="h-title">Titech AI 🚀</div>
    <div style="font-size:10px; margin-top:2px; background:#111; color:#00ffd0; padding:2px 6px; border-radius:8px; display:inline-block;">Free tier 💎</div>
  </div>
</div>
<div class="h-right">
<span class="pill friendly">friendly</span>
<button class="icon-btn" onclick="openPrefs()">⚙️</button>
</div>
</div>
<!-- 2. Personal Prefs Modal - no design scatter -->
<div id="prefsModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:999; justify-content:center; align-items:center;">
  <div style="background:#1a1a1a; padding:20px; border-radius:12px; width:90%; max-width:320px; color:#fff; font-family:inherit;">
    <h4 style="margin:0 0 10px;">Personal Preferences</h4>
    <label style="font-size:12px;">Tone (5 personalities):</label>
    <select id="toneSelect" style="width:100%; padding:8px; margin:8px 0; border-radius:8px; background:#000; color:#fff; border:1px solid #333;">
      <option value="friendly">friendly</option>
      <option value="hype">hype</option>
      <option value="professional">professional</option>
      <option value="short">short</option>
      <option value="teacher">teacher</option>
    </select>
    <p style="font-size:12px; margin-top:12px;">Username: <b id="showUsername"></b></p>
    <p style="font-size:12px;">Email: <b id="showEmail"></b></p>
    <p style="font-size:12px; margin-top:8px;">Feedback: <a href="mailto:olajidetimileyinsamson@gmail.com" style="color:#00ffd0; text-decoration:none;">olajidetimileyinsamson@gmail.com</a></p>
    <button onclick="savePrefs()" style="margin-top:12px; width:100%; padding:10px; border-radius:8px; background:#00ffd0; color:#000; font-weight:700; border:0;">Save</button>
    <button onclick="document.getElementById('prefsModal').style.display='none'" style="margin-top:8px; width:100%; padding:8px; border-radius:8px; background:transparent; color:#fff; border:1px solid #333;">Close</button>
  </div>
<div id="chat"></div>
<div class="bottom">
<div class="input-bar"><button class="plus">+</button><input id="msg" placeholder="Ask Titech AI 🚀..." onkeypress="if(event.key==='Enter')send()"><button class="send" onclick="send()">↑</button></div>
<div class="trust">Free tier · Privacy on · No training on your chats</div>
</div>
</div>
<script>
let chat=document.getElementById('chat'), input=document.getElementById('msg');
function add(t,c){
 let w=document.createElement('div');w.className=c+'-wrap';
 let d=document.createElement('div');d.className=c;d.textContent=t;
 w.appendChild(d);
 let a=document.createElement('div');a.className='actions';
 let cp=document.createElement('button');cp.textContent='📋 Copy';cp.onclick=()=>{navigator.clipboard.writeText(t);cp.textContent='✅';setTimeout(()=>cp.textContent='📋 Copy',1000)};
 let del=document.createElement('button');del.textContent='🗑️ Delete';del.onclick=()=>w.remove();
 a.appendChild(cp);a.appendChild(del);w.appendChild(a);chat.appendChild(w);chat.scrollTop=chat.scrollHeight;
}
async function send(){let t=input.value.trim();if(!t)return;add(t,'user');input.value='';let ty=document.createElement('div');ty.className='ai-wrap';ty.innerHTML='<div class=\"ai\">Thinking...</div>';chat.appendChild(ty);chat.scrollTop=chat.scrollHeight;try{let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});let d=await r.json();ty.remove();add(d.response||d.reply||'No reply','ai');}catch{ty.remove();add('Network glitch','ai');}}
add("Hey! I'm Titech AI 🚀 — ready to help. What you wan work on today?","ai");
</script>
 <div id="greetPopup" style="position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#111; color:#fff; padding:12px 20px; border-radius:12px; z-index:9999; display:none; font-weight:600; border:1px solid #333; box-shadow:0 4px 20px rgba(0,0,0,.5);"></div>

<script>
// 3. NEVER FORGET USERNAME + EMAIL + LAGOS GREETING
let username = localStorage.getItem("titech_username");
if(!username){
  username = prompt("Wetin be your name? Make Titech AI remember you") || "Boss";
  localStorage.setItem("titech_username", username);
}
let userEmail = localStorage.getItem("titech_email");
if(!userEmail){
  userEmail = prompt("Your email (for settings)?") || "";
  if(userEmail) localStorage.setItem("titech_email", userEmail);
}

function lagosGreeting(){
  const hour = parseInt(new Date().toLocaleString("en-US",{timeZone:"Africa/Lagos", hour:"2-digit", hour12:false}));
  if(hour < 12) return "Good morning";
  if(hour < 17) return "Good afternoon";
  return "Good evening";
}

window.addEventListener("load", ()=>{
  const pop = document.getElementById("greetPopup");
  if(pop){
    pop.textContent = `${lagosGreeting()}, ${username} 👋`;
    pop.style.display = "block";
    setTimeout(()=> pop.style.display="none", 3000);
  }
  const uEl = document.getElementById("showUsername");
  const eEl = document.getElementById("showEmail");
  if(uEl) uEl.textContent = username;
  if(eEl) eEl.textContent = userEmail || "Not set";
  const savedTone = localStorage.getItem("titech_tone") || "friendly";
  const sel = document.getElementById("toneSelect");
  if(sel) sel.value = savedTone;
  const pill = document.querySelector(".pill");
  if(pill) pill.textContent = savedTone;
});

function openPrefs(){ 
  document.getElementById("prefsModal").style.display="flex";
}
function savePrefs(){
  const tone = document.getElementById("toneSelect").value;
  localStorage.setItem("titech_tone", tone);
  const pill = document.querySelector(".pill");
  if(pill) pill.textContent = tone;
  document.getElementById("prefsModal").style.display="none";
}
</script>
</body>
</html>
