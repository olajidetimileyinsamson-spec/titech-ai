<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Titech AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#02060e;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh}
.card{width:90%;max-width:360px;padding:22px;border-radius:20px;background:linear-gradient(rgba(9,25,56,0.9),rgba(9,25,56,0.9));border:1px solid rgba(110,231,255,0.2);box-shadow:0 0 20px rgba(123,92,255,0.4)}
input{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.4);color:#fff;margin-top:10px;outline:none}
button{width:100%;padding:12px;border-radius:12px;border:0;margin-top:12px;font-weight:700}
.btn-white{background:#fff;color:#000}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.2);color:#fff}
.small{font-size:12px;opacity:0.7;text-align:center;margin-top:10px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="card">
<img src="/logo.png" style="width:42px;border-radius:10px;display:block;margin:0 auto 8px">
<h2 style="text-align:center;margin:0">Welcome to Titech AI</h2>
<p class="small">Login like ChatGPT — your chats go save</p>
<input id="email" type="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password (min 6)">
<button class="btn-white" onclick="doLogin()">Log in</button>
<button class="btn-ghost" onclick="doSignup()">Sign up</button>
<p class="small" id="msg"></p>
<p class="small">Built solo by Olajide Timileyin Samson 🇳🇬</p>
</div>
<script>
let supa=null;
async function init(){
 let cfg=await fetch("/config").then(r=>r.json());
 supa=supabase.createClient(cfg.supabase_url, cfg.supabase_key);
 let {data}=await supa.auth.getSession();
 if(data.session){ localStorage.setItem("titech_email",data.session.user.email); location.href="/"; }
}
init();
async function doLogin(){
 let email=document.getElementById("email").value.trim();
 let pass=document.getElementById("pass").value.trim();
 document.getElementById("msg").textContent="Logging in...";
 let {data,error}=await supa.auth.signInWithPassword({email,password:pass});
 if(error){ document.getElementById("msg").textContent=error.message; }
 else{ localStorage.setItem("titech_email",email); localStorage.setItem("titech_name",email.split("@")[0]); location.href="/"; }
}
async function doSignup(){
 let email=document.getElementById("email").value.trim();
 let pass=document.getElementById("pass").value.trim();
 document.getElementById("msg").textContent="Creating account...";
 let {data,error}=await supa.auth.signUp({email,password:pass});
 if(error){ document.getElementById("msg").textContent=error.message; }
 else{ document.getElementById("msg").textContent="Check email to confirm, then Log in"; }
}
</script>
</body>
</html>
